name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Tools
        run: |
          pip install flet google-generativeai
      - name: Prepare and Build
        run: |
          # هذه الخطوة تنشئ ملفات المشروع غصباً عن أي خطأ
          flet create . --template app
          # ننسخ ملف الكود الخاص بك لضمان أنه هو الذي سيتم بناؤه
          cp main.py main.py 
          flet build apk
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ClashOfMinds-App
          path: build/apk/*.apk
          
