name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # تحديث للإصدار 4

      - name: Set up Python
        uses: actions/setup-python@v5 # تحديث للإصدار 5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install flet google-generativeai

      - name: Build APK
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          flet build apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4 # هذا هو السطر الذي تسبب في الخطأ، تم تحديثه إلى v4
        with:
          name: clash-of-minds-app
          path: build/apk/*.apk
          
