name: Deploy Web App
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install flet google-generativeai
      - name: Publish Web
        run: |
          flet publish main.py
      - name: Upload Web Files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist # هذا هو المجلد الذي ينتج عن Publish

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        
