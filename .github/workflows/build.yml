name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install flet==0.24.1 flet-cli==0.24.1 google-generativeai

      - name: Build APK
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-of-minds-app
          path: build/apk/*.apk
